<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成 5G 磁贴图标</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f5f6f8; color:#1b1c1e;
         margin:0; padding:28px; display:flex; flex-direction:column; align-items:center; gap:22px; }
  h1 { font-size:17px; font-weight:600; margin:0; }
  .hint { font-size:13px; color:#5b616e; max-width:520px; line-height:1.6; text-align:center; margin:0; }
  .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.08); width:520px; }
  .row { display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .prev { width:96px; height:96px; border-radius:50%; background:#0d6efd; display:flex;
          align-items:center; justify-content:center; }
  .prev.small { width:36px; height:36px; }
  .prev.gray { background:#e8eaed; }
  input[type=text] { font-size:26px; font-weight:800; width:120px; text-align:center; padding:8px;
                     border:1px solid #d3d7de; border-radius:10px; letter-spacing:1px; }
  button { font-size:14px; padding:10px 18px; border-radius:10px; border:0; cursor:pointer;
           background:#0d6efd; color:#fff; font-weight:600; }
  button.ghost { background:#eef1f6; color:#2a2f3a; }
  canvas { display:none; }
  label { font-size:13px; color:#5b616e; }
  .note { font-size:12px; color:#8a909c; line-height:1.6; }
</style>
</head>
<body>
<h1>生成「5G」磁贴图标</h1>
<p class="hint">Android 的矢量图不支持文字，所以用浏览器把你手机里的字体渲染成 PNG。
生成的图放进 <code>app/src/main/res/drawable-nodpi/ic_tile_5g.png</code> 即可。</p>

<div class="card">
  <div class="row">
    <label>文字</label>
    <input id="txt" type="text" value="5G" maxlength="3">
    <label>字重</label>
    <input id="weight" type="range" min="400" max="900" step="100" value="800" style="width:100px">
  </div>
  <div class="row" style="margin-top:20px">
    <span class="prev small" id="p36"></span>
    <span class="prev" id="p96"></span>
  </div>
  <div class="row" style="margin-top:20px">
    <button onclick="download()">下载 ic_tile_5g.png</button>
    <button class="ghost" onclick="downloadWhite()">下载白色版（用于深色磁贴）</button>
  </div>
  <p class="note">磁贴图标会被系统自动染色，建议下载<b>白色版</b>；上面蓝色只是预览。</p>
</div>

<canvas id="cv" width="512" height="512"></canvas>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const txt = document.getElementById('txt'), weight = document.getElementById('weight');

function draw(color) {
  const S = 512;
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = color;
  const w = parseInt(weight.value, 10);
  // 字号自适应：先按 320 画，超宽再缩
  let size = 320;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const font = (s) => `${w} ${s}px -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif`;
  ctx.font = font(size);
  const measure = ctx.measureText(txt.value);
  const maxW = S * 0.78;
  if (measure.width > maxW) {
    size = Math.floor(size * maxW / measure.width);
    ctx.font = font(size);
  }
  // 视觉居中：粗体字母的基线略偏
  ctx.fillText(txt.value, S / 2, S / 2 + size * 0.02);
}

function preview() {
  draw('#ffffff');
  for (const [id, px] of [['p36', 36], ['p96', 96]]) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    const img = new Image();
    img.src = cv.toDataURL();
    img.style.width = (px * 0.62) + 'px';
    img.style.height = (px * 0.62) + 'px';
    el.appendChild(img);
  }
}

function save(name, dataUrl) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.click();
}

function download() { draw('#0d6efd'); save('ic_tile_5g.png', cv.toDataURL('image/png')); preview(); }
function downloadWhite() { draw('#ffffff'); save('ic_tile_5g.png', cv.toDataURL('image/png')); preview(); }

txt.addEventListener('input', preview);
weight.addEventListener('input', preview);
preview();
</script>
</body>
</html>
